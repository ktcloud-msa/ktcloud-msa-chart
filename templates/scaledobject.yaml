{{- if .Values.keda.enabled }}
# KEDA ScaledObject — event-driven autoscaling. Triggers are supplied per
# service (Kafka consumer lag for the saga consumers, plus an optional cron
# trigger to pre-warm replicas at peak hours). KEDA creates/owns the underlying
# HPA, so the chart's own hpa.yaml is left disabled on KEDA-managed services.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    {{- if .Values.rollout.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ .Release.Name }}
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 2 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 10 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 120 }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 15 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    {{- toYaml .Values.keda.triggers | nindent 4 }}
{{- end }}
