{{- /*
A separate K8s Secret holding only JWT_SECRET, kept out of ExternalSecrets so
ESO does not overwrite it with the placeholder value coming from AWS SM.
*/}}
{{- if .Values.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jwt
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
{{- end }}
