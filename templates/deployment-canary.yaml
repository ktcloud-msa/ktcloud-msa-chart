{{- if and .Values.canary.enabled (not .Values.rollout.enabled) }}
# Canary Deployment — a second ReplicaSet carrying the same `app` selector
# label (so it sits behind the same Service) but `version: canary`. The Istio
# DestinationRule subset + VirtualService weight route a slice of traffic here.
# Image tag comes from canary.tag; replica count is fixed (small) and NOT
# autoscaled, so the canary share is purely weight-driven.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
    version: canary
spec:
  replicas: {{ .Values.canary.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      version: canary
  template:
    metadata:
      labels:
        {{- include "ktcloud.labels" . | nindent 8 }}
        version: canary
      annotations:
        checksum/config: {{ .Values.appConfig | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ include "ktcloud.serviceAccountName" . }}
      automountServiceAccountToken: {{ (default dict .Values.serviceAccount).automountServiceAccountToken | default false }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile | default "RuntimeDefault" }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.canary.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.appConfig.server.port | default 8080 }}
              protocol: TCP
            {{- if .Values.appConfig.grpc.server }}
            - name: grpc
              containerPort: {{ .Values.appConfig.grpc.server.port | default 9090 }}
              protocol: TCP
            {{- end }}
          args:
            - "--spring.config.location=optional:classpath:/,optional:file:/config/application.yaml"
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop: ["ALL"]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            {{- if .Values.tmpVolumes.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ (.Values.externalSecret | default dict).targetName | default (printf "%s-secrets" .Release.Name) }}
                optional: true
            {{- if .Values.jwtSecret }}
            - secretRef:
                name: {{ .Release.Name }}-jwt
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.tmpVolumes.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
{{- end }}
