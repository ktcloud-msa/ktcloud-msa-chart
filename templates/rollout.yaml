{{- if .Values.rollout.enabled }}
# Argo Rollouts progressive canary. Replaces the plain Deployment (which is
# gated off when rollout.enabled) and the Istio-weighted canary Deployment.
# The pod spec mirrors deployment.yaml exactly so a service can flip between
# the two delivery modes with a single flag. Traffic split is pod-count
# proportional behind the one Service; an Analysis step gates each weight bump
# on the Prometheus 5xx error-rate recording rule and auto-rolls-back on breach.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
    version: stable
spec:
  {{- /* When KEDA/HPA owns the replica count, omit replicas so the autoscaler
         (which targets this Rollout) is authoritative. */}}
  {{- if not (or .Values.autoscaling.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount | default 2 }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "ktcloud.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # NOTE: scaleDownDelaySeconds is intentionally omitted — Argo Rollouts only
      # accepts it together with traffic routing (trafficRouting.*), and this
      # chart uses pod-count-proportional canary (no traffic router), so setting
      # it makes the Rollout spec invalid ("InvalidSpec").
      # Argo labels the canary/stable ReplicaSets so the existing Istio
      # DestinationRule subsets (version: stable|canary) keep classifying pods.
      canaryMetadata:
        labels:
          version: canary
      stableMetadata:
        labels:
          version: stable
      steps:
        {{- range .Values.rollout.steps }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ $.Release.Name }}-error-rate
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "ktcloud.labels" . | nindent 8 }}
        version: stable
      annotations:
        checksum/config: {{ .Values.appConfig | toYaml | sha256sum }}
        {{- if .Values.metrics.serviceMonitor.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.serviceMonitor.path | quote }}
        prometheus.io/port: {{ include "ktcloud.httpPort" . | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ktcloud.serviceAccountName" . }}
      automountServiceAccountToken: {{ (default dict .Values.serviceAccount).automountServiceAccountToken | default false }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile | default "RuntimeDefault" }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.appConfig.server.port | default 8080 }}
              protocol: TCP
            {{- if .Values.appConfig.grpc.server }}
            - name: grpc
              containerPort: {{ .Values.appConfig.grpc.server.port | default 9090 }}
              protocol: TCP
            {{- end }}
          args:
            - "--spring.config.location=optional:classpath:/,optional:file:/config/application.yaml"
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop: ["ALL"]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            {{- if .Values.tmpVolumes.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ (.Values.externalSecret | default dict).targetName | default (printf "%s-secrets" .Release.Name) }}
                optional: true
            {{- if .Values.jwtSecret }}
            - secretRef:
                name: {{ .Release.Name }}-jwt
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.tmpVolumes.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
{{- end }}
