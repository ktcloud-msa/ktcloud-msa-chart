{{- if .Values.metrics.serviceMonitor.enabled }}
# ServiceMonitor — registers this service's Spring Boot Actuator Prometheus
# endpoint as a scrape target. kube-prometheus-stack discovers every
# ServiceMonitor regardless of label (serviceMonitorSelectorNilUsesHelmValues=false).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "ktcloud.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.metrics.serviceMonitor.port | default "http" }}
      path: {{ .Values.metrics.serviceMonitor.path | default "/prometheus" }}
      interval: {{ .Values.metrics.serviceMonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
      honorLabels: {{ .Values.metrics.serviceMonitor.honorLabels | default true }}
      relabelings:
        - action: replace
          targetLabel: service
          replacement: {{ .Release.Name }}
{{- end }}
