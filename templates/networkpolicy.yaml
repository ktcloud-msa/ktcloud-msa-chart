{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Release.Namespace -}}
# NetworkPolicy — once this policy selects the Pod, only the traffic enumerated
# below is permitted (implicit default-deny for everything else).
#
# Ingress:  intra-namespace (service mesh) + Prometheus scrape from monitoring
#           + optional external ingress (gateway only, allowExternal=true).
# Egress:   DNS + intra-namespace (own Postgres/Redis + sibling services) +
#           istio-system (xDS/mTLS bootstrap) + data namespaces (Kafka).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ktcloud.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # intra-namespace service-to-service traffic
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel }}: {{ $ns }}
    # Prometheus scrape (ServiceMonitor) from the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel }}: {{ .Values.networkPolicy.monitoringNamespace }}
    {{- if .Values.networkPolicy.allowExternal }}
    # External ingress (edge: ALB/Traefik -> gateway). Open to all sources on
    # the app ports; the gateway itself enforces JWT auth.
    - from: []
      ports:
        - port: http
        {{- if .Values.appConfig.grpc.server }}
        - port: grpc
        {{- end }}
    {{- end }}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # intra-namespace (own Postgres/Redis + sibling MSA services over gRPC)
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel }}: {{ $ns }}
    # istio control plane (xDS 15012) + mesh bootstrap
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel }}: istio-system
    {{- range .Values.networkPolicy.dataNamespaces }}
    # data namespace: {{ . }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{ $.Values.networkPolicy.ingressNamespaceLabel }}: {{ . }}
    {{- end }}
{{- end }}
