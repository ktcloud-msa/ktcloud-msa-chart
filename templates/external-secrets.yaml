{{- if and .Values.externalSecret .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ (.Values.externalSecret.secretStoreRef | default dict).name | default "aws-secrets" }}
    kind: {{ (.Values.externalSecret.secretStoreRef | default dict).kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.externalSecret.targetName | default (printf "%s-secrets" .Release.Name) }}
    creationPolicy: Owner
  {{- if .Values.externalSecret.awsSecretName }}
  # Pull every JSON key from the AWS SM secret verbatim into the K8s Secret.
  # This is what Spring Boot envFrom consumes (DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET).
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.awsSecretName }}
  {{- end }}
  {{- if .Values.externalSecret.keys }}
  # Optional remappings — used to alias SM JSON keys onto names Bitnami
  # subcharts require (e.g. postgresql.auth.existingSecret needs `password` /
  # `postgres-password`; redis.auth.existingSecret needs `redis-password`).
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey | default $.Values.externalSecret.awsSecretName }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
