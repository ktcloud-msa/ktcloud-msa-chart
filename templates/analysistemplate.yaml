{{- if .Values.rollout.enabled }}
# Argo Rollouts AnalysisTemplate referenced by the Rollout's analysis steps.
# Each canary weight bump is gated on this: it polls the service's 5xx
# error-rate recording rule (service:http_error_rate:ratio5m, published by the
# 31-monitoring-config PrometheusRule) and fails the measurement once the ratio
# exceeds errorRateThreshold. failureLimit consecutive failures abort the
# Rollout, which then auto-rolls-back to the last stable ReplicaSet.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-error-rate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
spec:
  metrics:
    - name: error-rate
      interval: {{ .Values.rollout.analysis.interval | default "60s" }}
      count: {{ .Values.rollout.analysis.count | default 3 }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit | default 1 }}
      # successCondition: the measured 5xx ratio must stay at/below threshold.
      # `OR on(...) vector(0)` makes a no-traffic window (empty result) read as
      # 0 instead of failing the analysis.
      successCondition: result[0] <= {{ .Values.rollout.analysis.errorRateThreshold | default "0.05" }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: >-
            sum(service:http_error_rate:ratio5m{application="{{ .Values.appConfig.spring.application.name | default .Release.Name }}"})
            OR on() vector(0)
{{- end }}
