{{- if and .Values.cnpg.enabled (default dict .Values.externalSecret).enabled }}
# basic-auth Secret consumed by the CNPG Cluster bootstrap (initdb.secret.name).
# CNPG requires type kubernetes.io/basic-auth with `username` (== initdb.owner)
# and `password`. We source the password from the SAME AWS Secrets Manager
# DB_PASSWORD the app reads, so `spring.datasource.password: ${DB_PASSWORD}`
# authenticates against the role CNPG creates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cnpg.name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ (.Values.externalSecret.secretStoreRef | default dict).name | default "aws-secrets" }}
    kind: {{ (.Values.externalSecret.secretStoreRef | default dict).kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.cnpg.name }}-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Let CNPG hot-reload the role password if it rotates in AWS SM.
          cnpg.io/reload: "true"
      data:
        username: {{ .Values.cnpg.owner | quote }}
        password: "{{ `{{ .DB_PASSWORD }}` }}"
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.awsSecretName }}
        property: DB_PASSWORD
{{- end }}
