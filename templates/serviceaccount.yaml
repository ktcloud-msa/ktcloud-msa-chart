{{- if (default dict .Values.serviceAccount).create }}
# Per-service ServiceAccount. Token automount is disabled because the Spring
# Boot services never talk to the Kubernetes API — least privilege by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ktcloud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktcloud.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
