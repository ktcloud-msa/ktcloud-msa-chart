apiVersion: v2
name: ktcloud-msa-microservice
description: KtCloud MSA Market Service
type: application
version: 0.4.0
appVersion: "1.0.0"

dependencies:
  # PostgreSQL is no longer a Bitnami subchart — each service renders a
  # CloudNativePG `Cluster` CR instead (see templates/postgres-cnpg-*.yaml),
  # managed by the cnpg-operator platform app.
  - name: redis
    version: 20.0.x
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
