name: chart-ci

# Validates the shared MSA Helm chart on every PR/push: lint, render, schema
# check, and a Trivy IaC config scan that fails on HIGH/CRITICAL misconfig
# (privileged containers, root execution, missing securityContext, ...).
on:
  push:
    branches: [main, template]
  pull_request:

jobs:
  lint-render-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint . --set image.repository=ci/placeholder

      - name: helm template (render)
        run: |
          helm dependency build .
          helm template ci . \
            --set image.repository=ci/placeholder \
            --namespace ktcloud-market-msa > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: kubeconform (manifest schema validation)
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered.yaml

      - name: Trivy config scan (IaC misconfig gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"        # fail the pipeline on any HIGH/CRITICAL finding
          format: table

      - name: Notify Slack #security-report on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: "#security-report"
          slack-message: ":x: chart-ci failed for ${{ github.repository }}@${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
